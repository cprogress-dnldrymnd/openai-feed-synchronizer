name: Sync Shopify catalogue to OpenAI Ads feed

on:
  schedule:
    - cron: "0 6 * * *"   # once daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional: limit number of variants (for a small test run)"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write SFTP private key
        if: ${{ env.SFTP_PASSWORD == '' }}
        run: |
          echo "${{ secrets.SFTP_PRIVATE_KEY_B64 }}" | base64 -d > openai_sftp_key.pem
          chmod 600 openai_sftp_key.pem

      - name: Run sync
        env:
          SHOPIFY_DOMAIN: ${{ secrets.SHOPIFY_DOMAIN }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_UPLOAD_PATH: ${{ secrets.SFTP_UPLOAD_PATH }}
          PRIVATE_KEY_PATH: ./openai_sftp_key.pem
          STOREFRONT_URL: https://coptrz.com
          SELLER_NAME: Coptrz
          TARGET_COUNTRY: GB
          CURRENCY: GBP
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node src/sync.js --limit "${{ github.event.inputs.limit }}"
          else
            node src/sync.js
          fi

      - name: Remove private key
        if: always()
        run: rm -f openai_sftp_key.pem

      - name: Upload generated feed as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coptrz-feed-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
